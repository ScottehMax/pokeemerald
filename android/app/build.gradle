plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def repoRoot = file("../..").canonicalFile
def properties = new Properties()
def propertiesFile = rootProject.file("local.properties")
if (propertiesFile.exists()) {
    propertiesFile.withInputStream { properties.load(it) }
}
def sdl2Source = properties.getProperty("sdl2.dir", System.getenv("SDL2_SOURCE"))
if (sdl2Source == null) {
    throw new GradleException("Set sdl2.dir in android/local.properties or SDL2_SOURCE to an SDL 2.32.x source tree")
}

android {
    namespace "org.pokeemerald.pc"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "org.pokeemerald.pc"
        minSdk 23
        targetSdk 35
        versionCode 27
        versionName "0.3.8"

        externalNativeBuild {
            cmake {
                arguments "-DPOKEEMERALD_ROOT=${repoRoot}", "-DSDL2_SOURCE=${file(sdl2Source).canonicalPath}"
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            universalApk false
        }
    }

    sourceSets {
        main.java.srcDir file("${sdl2Source}/android-project/app/src/main/java")
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs.useLegacyPackaging = true
        jniLibs.keepDebugSymbols += ["**/libpokeemerald_core.so"]
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.compose.material3:material3"
    testImplementation "junit:junit:4.13.2"
}

def verifyDebugApks = tasks.register("verifyDebugApks") {
    doLast {
        def apks = fileTree(layout.buildDirectory.dir("outputs/apk/debug")) {
            include "*.apk"
        }.files
        if (apks.isEmpty()) {
            throw new GradleException("No debug APKs were produced")
        }

        apks.each { apk ->
            def archive = new java.util.zip.ZipFile(apk)
            try {
                ["AndroidManifest.xml", "classes.dex", "resources.arsc"].each { entry ->
                    if (archive.getEntry(entry) == null) {
                        throw new GradleException("${apk.name} is incomplete: missing ${entry}")
                    }
                }
            } finally {
                archive.close()
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "packageDebug") {
        // AGP appends changed unstripped native libraries to split APKs, leaving
        // the previous compressed entry as dead space. Recreate only the APK
        // packaging state; native compilation and resource processing stay
        // incremental.
        task.outputs.upToDateWhen { false }
        task.doFirst {
            delete(fileTree(layout.buildDirectory.dir("outputs/apk/debug")) {
                include "*.apk"
            })
            delete(layout.buildDirectory.dir("intermediates/incremental/packageDebug"))
        }
    }
}

afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy verifyDebugApks
    }
}
